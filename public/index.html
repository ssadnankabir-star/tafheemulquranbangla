function auditSheet(){sheet('v4.1 — পরিবর্তন ও তথ্য যাচাই','<div class="prose"><h4>আরবি যাচাই</h4><p>আপনার দেওয়া Android 1.35.8 ও macOS প্যাকেজের ডেটাবেস পরীক্ষা করা হয়েছে। ১১৪টি সূরার ৬,২৩৬টি উসমানী এবং ৬,২৩৬টি ইন্দোপাক আয়াত হুবহু সংযুক্ত আছে। ৭৭,৪২৯টি শব্দের অবস্থান, শব্দ বিশ্লেষণ এবং রুট/লেমা মিলিয়ে নেওয়া হয়েছে।</p><p>v4-এর মূল উসমানী পাঠে অক্ষর বা হরকত পরিবর্তন পাওয়া যায়নি; ৩৭:১৩০-এ একটি সূক্ষ্ম ফাঁকের পার্থক্য ছিল। বড় সমস্যা ছিল ইন্দোপাক ফন্টে উসমানী লেখা দেখানো এবং প্রদর্শনের সময় ٱ-কে ا বানানো। এখন দুই লিপির পাঠ আলাদা এবং এমন প্রতিস্থাপন নেই। মূল অ্যাপের ফন্টও সংযুক্ত।</p><h4>নতুন পড়ার সুবিধা</h4><ul><li>দুই দিকে সোয়াইপ ও কিবোর্ডে বিভাগ বদল। শুরু ও শেষে সঠিক সীমা।</li><li>একক আয়াত ও একক শব্দে সোয়াইপ; সূরার সীমানা পেরিয়ে চলা।</li><li>৬০৪ পৃষ্ঠা, ৩০ পারা, ৬০ হিজব, ২৪০ চতুর্থাংশ এবং ৫৫৮ রুকুর মূল সূচি।</li><li>আরবি, বাংলা, English ও শব্দার্থ খোঁজা; রুট/লেমার সব ব্যবহার।</li><li>৩১৭টি মূল বিষয় ও উপবিষয়, আয়াত কপি/শেয়ার, নোট ও পিনের ফোল্ডার।</li><li>অফলাইন English অনুবাদ, পড়ার স্থান মনে রাখা, সক্রিয় সময় গণনা।</li><li>অডিও সীমা, পুনরাবৃত্তি, বিরতি, গতি, সময় নির্বাচন ও ডাউনলোড।</li><li>কাস্টম প্ল্যান ও সম্পন্ন সেশন; ব্যাকআপ এক্সপোর্ট/ইমপোর্ট।</li></ul><h4>যাচাইয়ের সীমা</h4><p>এটি আপলোড করা অ্যাপের ডেটার সঙ্গে অক্ষরভিত্তিক মিল পরীক্ষা। স্বতন্ত্র মুসহাফ বা আলেমের প্রুফরিডিংয়ের সনদ নয়। দুই প্যাকেজের ইন্দোপাক সংস্করণে পার্থক্য আছে; এখানে Android 1.35.8-এর পাঠ ব্যবহার করা হয়েছে। মূল প্যাকেজ ইন্দোপাককে Beta বলেছে। অনুবাদ ও তাফসিরের v4 পাঠ রাখা হয়েছে। উসমানী তাজউইদের রং v4 থেকে সংরক্ষিত; নতুন করে প্রতিটি নিয়মের শুদ্ধতা সনদ দেওয়া হয়নি।</p><p>সম্পূর্ণ অডিও প্যাকেজে ছিল না। ডাউনলোড ছাড়া তিলাওয়াতের অডিওতে ইন্টারনেট লাগে। GTAF অ্যাকাউন্ট সিঙ্ক, নেটিভ উইজেট/নোটিফিকেশন, ভয়েস সার্চ এবং ছবি-ভিত্তিক মুসহাফ এই এক ফাইলের সংস্করণে যুক্ত হয়নি।</p><button class="btn" id="auditdownload">যাচাইয়ের রেকর্ড সংরক্ষণ</button></div>',function(e){if(e.target.closest('#auditdownload'))download('Quran_v4_1_Data_Audit.json',JSON.stringify(X.audit,null,2),'application
